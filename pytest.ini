[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    db: needs the PostgreSQL test database (skipped when it is unreachable)
    security: part of the security testing report
filterwarnings =
    ignore::DeprecationWarning
addopts = -p no:cacheprovider
